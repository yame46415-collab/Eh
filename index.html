<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Quick Helper</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22Quick%20Helper%22%2C%20%22short_name%22%3A%20%22Helper%22%2C%20%22start_url%22%3A%20%22.%2F%22%2C%20%22scope%22%3A%20%22.%2F%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%230b1120%22%2C%20%22theme_color%22%3A%20%22%230b1120%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20512%20512%27%253E%253Cdefs%253E%253ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%253E%253Cstop%20offset%3D%270%27%20stop-color%3D%27%25234f8cff%27%2F%253E%253Cstop%20offset%3D%271%27%20stop-color%3D%27%25238f5bff%27%2F%253E%253C%2FlinearGradient%253E%253C%2Fdefs%253E%253Crect%20width%3D%27512%27%20height%3D%27512%27%20rx%3D%27112%27%20fill%3D%27url%28%2523g%29%27%2F%253E%253Ctext%20x%3D%27256%27%20y%3D%27340%27%20font-family%3D%27Arial%2CHelvetica%2Csans-serif%27%20font-size%3D%27280%27%20font-weight%3D%27bold%27%20fill%3D%27%2523fff%27%20text-anchor%3D%27middle%27%253E%3F%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%20%22sizes%22%3A%20%22any%22%2C%20%22type%22%3A%20%22image%2Fsvg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%20maskable%22%7D%5D%7D">
<style>
:root{color-scheme:dark;--bg:#0b1120;--card:#151d2e;--line:#26324a;--text:#e8edf7;--muted:#9aa8bf;--accent:#4f8cff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
header{padding:18px 16px 8px;display:flex;align-items:center;gap:10px}header h1{font-size:19px;margin:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#8f5bff);display:grid;place-items:center;font-weight:800}
main{padding:8px 16px 110px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
#chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;line-height:1.45;white-space:pre-wrap}
.you{align-self:flex-end;background:#2b4a8a;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1d2637;border:1px solid var(--line);border-bottom-left-radius:4px}
#composer{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(11,17,32,0),var(--bg) 32%)}
.bar{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;align-items:center}
input{flex:1;background:transparent;border:0;color:var(--text);font:inherit;outline:none}
button{border:0;cursor:pointer;font:inherit}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:white;font-size:18px}
.mic{width:42px;height:42px;border-radius:50%;background:#1d2637;border:1px solid var(--line);color:var(--text)}
#bubble{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#8f5bff);color:white;font-size:24px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:50;touch-action:none}
#panel{position:fixed;inset:auto 12px 12px 12px;max-width:560px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:none;z-index:60;box-shadow:0 16px 40px rgba(0,0,0,.55)}
#panel.open{display:block}
.row{display:flex;gap:8px;align-items:center}.close{background:transparent;color:var(--muted);font-size:20px;padding:4px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:#1d2637;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px}
</style></head><body>
<header><div class="logo">Q</div><h1>Quick Helper</h1></header>
<main><div class="card"><strong>Your helper is ready.</strong><div class="muted">Tap the floating button to ask something quickly. Add this page to your Home Screen for one-tap access.</div></div><div id="chat"></div></main>
<div id="composer"><div class="bar"><input id="q" placeholder="Ask for help…" autocomplete="off"><button id="mic" class="mic">🎙️</button><button id="send" class="send">↑</button></div></div>
<button id="bubble">?</button>
<div id="panel"><div class="row"><strong style="flex:1">Quick ask</strong><button id="close" class="close">✕</button></div><input id="quick" placeholder="What do you need help with?"><div class="chips"><button class="chip" data-q="Explain this simply: ">Explain simply</button><button class="chip" data-q="Summarize this: ">Summarize</button><button class="chip" data-q="Help me study: ">Study help</button><button class="chip" data-q="Write a polite message: ">Write message</button></div></div>
<script>
const chat=document.getElementById('chat'),q=document.getElementById('q'),send=document.getElementById('send'),mic=document.getElementById('mic'),bubble=document.getElementById('bubble'),panel=document.getElementById('panel'),quick=document.getElementById('quick');
function add(t,w){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});}
function answer(t){return 'I can help with that. Here is a starting plan:\n\n1. Clarify exactly what you need.\n2. Break it into small steps.\n3. Ask me for an example, explanation, or draft.\n\nYour request: '+t;}
function ask(t){if(!t.trim())return;add(t,'you');q.value='';setTimeout(()=>add(answer(t),'bot'),350);}
send.onclick=()=>ask(q.value);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask(q.value);}});
bubble.onclick=()=>{panel.classList.toggle('open');if(panel.classList.contains('open'))quick.focus();};
document.getElementById('close').onclick=()=>panel.classList.remove('open');
quick.addEventListener('keydown',e=>{if(e.key==='Enter'){ask(quick.value);quick.value='';panel.classList.remove('open');}});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{quick.value=b.dataset.q;quick.focus();});
mic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input is not supported in this browser.');return;}const r=new SR();r.lang='en-US';r.onresult=e=>{q.value=e.results[0][0].transcript;ask(q.value);};r.start();};
let sx=0,sy=0,drag=false;bubble.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX-bubble.offsetLeft;sy=e.clientY-bubble.offsetTop;bubble.setPointerCapture(e.pointerId);});
bubble.addEventListener('pointermove',e=>{if(!drag)return;bubble.style.left=Math.max(6,Math.min(innerWidth-bubble.offsetWidth-6,e.clientX-sx))+'px';bubble.style.right='auto';bubble.style.top=Math.max(6,Math.min(innerHeight-bubble.offsetHeight-6,e.clientY-sy))+'px';bubble.style.bottom='auto';});
bubble.addEventListener('pointerup',()=>drag=false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
